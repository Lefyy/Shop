{% extends "shop/base.html" %}

    <h3>Админ-панель</h3>
    <p>Выберите раздел для управления:</p>
    
    <div class="admin-button-grid">
        <a href="{% url 'shop:admin_customers' %}" class="admin-button" style="background-color: #198754;"> <i class="fas fa-users" style="margin-right: 15px;"></i> Покупатели

        <a href="{% url 'shop:admin_orders' %}" class="admin-button" style="background-color: #0d6efd;"> <i class="fas fa-shopping-cart" style="margin-right: 15px;"></i> Заказы
