{% extends "shop/base.html" %}
{% block content %}
<div class="container-fluid mt-4">
    <h3><i class="fas fa-users"></i> Покупатели</h3>
    <a href="{% url 'shop:admin_tables_main' %}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Назад к админ-панели</a>
    
    <form method="GET" action="{% url 'shop:admin_customers' %}" class="form-inline mb-3">
        <input class="form-control mr-sm-2" type="search" placeholder="Поиск по логину..." name="q" value="{{ search_query }}">
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Найти</button>
    </form>

    <table class="table table-sm table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Полное имя</th>
            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr style="cursor: pointer;" onclick="window.location='{% url 'shop:admin_orders_by_customer' customer_id=customer.id %}';">
                <td>{{ customer.id }}</td>
                <td>{{ customer.user.username }}</td>
                <td>{{ customer.user.first_name}}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">Покупатели не найдены.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
