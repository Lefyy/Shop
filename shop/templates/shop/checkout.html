{% extends "shop/base.html" %}
{% block content %}
<h3>Оформление заказа</h3>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <h5>Товары</h5>
  <ul>
    {% for it in items %}
      <li>{{ it.name }} — {{ it.quantity }} × {{ it.price }} = {{ it.subtotal }}</li>
    {% endfor %}
  </ul>
  <p><strong>Итого: {{ total }}</strong></p>
  <button class="btn btn-primary" type="submit">Подтвердить заказ</button>
</form>
{% endblock %}
