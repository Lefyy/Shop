{% extends "shop/base.html" %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
    {% endif %}
  </div>
  <div class="col-md-6">
    <h2>{{ product.name }}</h2>
    <p>Категория: {{ product.category.name }}</p>
    <p>Цена: {{ product.price }} ₽</p>
    <p>В наличии: {{ product.quantity }}</p>

    <form method="post" action="{% url 'shop:add_to_cart' product.id %}">
      {% csrf_token %}
      <div class="mb-2">
        <label for="quantity">Количество</label>
        <input id="quantity" name="quantity" type="number" min="1" value="1" class="form-control" {% if product.quantity is not None %}max="{{ product.quantity }}"{% endif %}>
      </div>
      <button class="btn btn-primary" type="submit">Добавить в корзину</button>
    </form>
  </div>
</div>
{% endblock %}
