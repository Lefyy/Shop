{% extends "shop/base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3>Вход</h3>

    {% if form.errors %}
      <div class="alert alert-danger">Неверный логин или пароль.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Имя пользователя</label>
        <input type="text" name="username" autofocus autocapitalize="none"
               class="form-control" id="id_username" value="{{ request.POST.username }}">
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" id="id_password">
      </div>

      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit" class="btn btn-primary">Войти</button>
      <a href="{% url 'shop:signup' %}" class="btn btn-link">Регистрация</a>
      <a href="{% url 'password_reset' %}" class="btn btn-link">Забыли пароль?</a>
    </form>
  </div>
</div>
{% endblock %}
